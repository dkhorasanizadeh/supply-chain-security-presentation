apiVersion: v1
kind: Namespace
metadata:
  name: supply-chain-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: supply-chain-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
        app.kubernetes.io/name: zot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot:v2.1.21
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: registry-storage
              mountPath: /var/lib/registry
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: registry-storage
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: supply-chain-demo
spec:
  type: NodePort
  clusterIP: 10.96.0.100
  selector:
    app: zot
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
